# Claude Code hooks merged into .claude/settings.json by `kit sync`. An entry with a
# `codex_matcher` is also written into .codex/hooks.json for Codex (a regex over Codex's tool names:
# shell commands are `Bash`, its subagent tool `spawn_agent`, alias `Agent`).

[[PreToolUse]]
matcher = "Bash|Agent|Task"
codex_matcher = "^(Bash|Agent|spawn_agent)$"
command = "\"${CLAUDE_PROJECT_DIR}/tools/writespec-guard\""
timeout = 10
statusMessage = "Checking writespec compliance..."

[[PreToolUse]]
matcher = "Bash"
codex_matcher = "^Bash$"
command = "\"${CLAUDE_PROJECT_DIR}/tools/spend-guard\""
timeout = 10
statusMessage = "Checking delegation spend ledger..."
